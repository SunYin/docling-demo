version: '3.8'

services:
  docling-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: docling-demo:latest
    container_name: docling-app

    # 方案 1: 使用镜像内置模型（推荐，启动快）
    # 无需额外配置，模型已打包在镜像中

    # 方案 2: 使用外部挂载的模型缓存（适合多容器共享或 NAS）
    # 取消下面的注释以启用外部挂载
    # volumes:
    #   - ./models:/models  # 本地目录挂载
    #   # 或使用 NAS/NFS 挂载
    #   # - /mnt/nas/docling-models:/models

    environment:
      - DOCLING_CACHE_DIR=/models
      # - HTTP_PROXY=http://your-proxy:port  # 如需代理
      # - HTTPS_PROXY=http://your-proxy:port

    # 如果要暴露 API 服务，可以添加端口映射
    # ports:
    #   - "8000:8000"

    # 资源限制（根据实际需求调整）
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

# 如果使用命名卷（方案 3）
# volumes:
#   docling-models:
#     driver: local

